<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The admin is a private tool: never index it. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Without this the browser asks for /favicon.ico, which does not exist. -->
    <link rel="icon" type="image/png" href="/jofit-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Geist draws the Latin, IBM Plex Sans Arabic the Arabic. A font stack falls
      back per glyph, so one sentence containing both renders each in the face
      that has it.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>JoFit Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
